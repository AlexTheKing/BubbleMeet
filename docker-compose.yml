services:
  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=8080
    networks:
      - bubble-meet-network
  signaling-server:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - SIGNALING_SERVER_HOST=0.0.0.0
      - SIGNALING_SERVER_PORT=8080
    depends_on:
      - triton-server
    networks:
      - bubble-meet-network
  nginx:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt
      - ./nginx/nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - signaling-server
    networks:
      - bubble-meet-network
  turn-server:
    image: coturn/coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    networks:
      - bubble-meet-network
    environment:
      - TURN_SECRET=turnsecret
      - TURN_USER=turnuser
      - TURN_PORT=3478
      - TURN_MIN_PORT=49152
      - TURN_MAX_PORT=49200
  triton-server:
    image: nvcr.io/nvidia/tritonserver:24.05-py3
    container_name: triton-inference-server
    ports:
      - "8000:8000"  # HTTP
      - "8001:8001"  # gRPC
      - "8002:8002"  # Metrics
    volumes:
      - ./ml/models:/models
      - ./ml/triton-env:/env
    shm_size: '2gb'  # Increase shared memory for Python backend
    networks:
      - bubble-meet-network
    # For local testing (CPU): comment out CUDA_VISIBLE_DEVICES and deploy section
    # For production (GPU): uncomment CUDA_VISIBLE_DEVICES and deploy section
    # environment:
    #   - CUDA_VISIBLE_DEVICES=0
    command: >
      tritonserver
      --model-repository=/models
      --log-verbose=1
      --allow-gpu-metrics=false
      --allow-http=true
      --allow-grpc=true
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    attach: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


networks:
  bubble-meet-network:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: false
