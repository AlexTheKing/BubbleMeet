services:
  web:
    build:
      context: bubble-meet-ui
      dockerfile: Dockerfile
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=8080
    networks:
      - bubble-meet-network
  signaling-server:
    build:
      context: bubble-meet
      dockerfile: Dockerfile
    environment:
      - SIGNALING_SERVER_HOST=0.0.0.0
      - SIGNALING_SERVER_PORT=8080
    networks:
      - bubble-meet-network
  ngnix:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt
      - ./nginx/nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - signaling-server
    networks:
      - bubble-meet-network
networks:
  bubble-meet-network:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: false
