services:
  web:
    build:
      context: bubble-meet-ui
      dockerfile: Dockerfile
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=8080
    networks:
      - bubble-meet-network
  signaling-server:
    build:
      context: bubble-meet
      dockerfile: Dockerfile
    environment:
      - SIGNALING_SERVER_HOST=0.0.0.0
      - SIGNALING_SERVER_PORT=8080
    networks:
      - bubble-meet-network
  ngnix:
    image: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/nginx-selfsigned.crt:/etc/ssl/certs/nginx-selfsigned.crt
      - ./nginx/nginx-selfsigned.key:/etc/ssl/private/nginx-selfsigned.key
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web
      - signaling-server
    networks:
      - bubble-meet-network
  turn-server:
    image: coturn/coturn
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49200:49152-49200/udp"
    networks:
      - bubble-meet-network
    environment:
      - TURN_SECRET=turnsecret
      - TURN_USER=turnuser
      - TURN_PORT=3478
      - TURN_MIN_PORT=49152
      - TURN_MAX_PORT=49200
networks:
  bubble-meet-network:
    driver: bridge
    enable_ipv4: true
    enable_ipv6: false
